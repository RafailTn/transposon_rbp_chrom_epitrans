# 3D-genome env: DELIBERATELY SEPARATE from ../deps.
#
# cooltools caps at numpy <2.0 in every packaged version; ../deps pins
# numpy ==2.4.6 because enrich_permutation.py's Generator.integers stream and
# enrich_stranded.py's hypergeom.sf both feed results/eclip/. Merging the two
# envs would silently respecify the permutation null. Do not merge them.
[workspace]
authors = ["RafailTn <rafailadam46@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "deps-3d"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26,<2"
scipy = ">=1.11,<2"
pandas = ">=2.0,<3"
h5py = ">=3.10"
matplotlib = ">=3.8,<4"
cooler = ">=0.10"
cooltools = ">=0.7"
bioframe = ">=0.7"
requests = ">=2.31"
